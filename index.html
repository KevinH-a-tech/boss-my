  var dd = Math.floor(ms / D), h = Math.floor(ms % D / H), m = Math.floor(ms % H / M), s = Math.floor(ms % M / 1000);
  if (dd > 0) return dd + "일 " + h + "시간";
  if (h > 0) return h + "시간 " + m + "분";
  return m + "분 " + pad(s) + "초";
}
function clockLeft(ms){
  if (ms < 0) ms = 0;
  if (ms >= D) { return Math.floor(ms / D) + "일 " + Math.floor(ms % D / H) + "시간"; }
  var h = Math.floor(ms / H), m = Math.floor(ms % H / M), s = Math.floor(ms % M / 1000);
  return h + ":" + pad(m) + ":" + pad(s);
}
function since(ms){ var m = Math.floor(ms / M); return m < 60 ? m + "분 경과" : Math.floor(m / 60) + "시간 " + (m % 60) + "분 경과"; }
/* 리젠 보스 처치 소요시간(초): 다음 젠 = 출현 + 처치 소요 + 리젠 주기 */
var KILL_SEC = {35:5, 40:10, 45:15, 55:20, 60:25, 65:30};
/* 스크린샷 남은 시간 → 출현 시각 보정
   - 초까지 적혀 있으면 ("1시간 30분 15초 후") 그대로 정확히 계산
   - 분 단위까지만 있으면 ("1시간 30분 후") 30초를 뺌 → 1:29:30 후로 입력
   늘 늦게 잡히면 더 빼고(예: -45초), 늘 빨리 잡히면 덜 빼면 됨 */
var SHOT_PAD = -30 * 1000;
function shotOffset(h, m, s){
  var t = (+h || 0) * H + (+m || 0) * M;
  return (s !== "" && s != null) ? t + (+s || 0) * 1000 : t + SHOT_PAD;
}
function killMs(b){ return (b && b.type === "respawn" && KILL_SEC[b.lv]) ? KILL_SEC[b.lv] * 1000 : 0; }
function cycLabel(b){ var s = killMs(b) / 1000; return ivLabel(b.interval) + (b.interval && s ? " · 처치 " + s + "초" : ""); }
function ivLabel(min){
  if (!min) return "리젠 주기 미정";
  if (min % 1440 === 0) return "리젠 " + (min / 1440) + "일";
  var h = Math.floor(min / 60), m = min % 60;
  return "리젠 " + (h ? h + "시간" : "") + (m ? " " + m + "분" : "");
}
var DAYCH = "일월화수목금토";
function hourText(b){ return b.hours.join("·") + "시" + (b.minute ? " " + b.minute + "분" : ""); }
function daysText(days){ return days.length === 7 ? "매일" : days.slice().sort().map(function(d){ return DAYCH[d]; }).join(","); }
function fixedLabel(b){
  if (b.days.length === 7) return "매일 " + hourText(b);
  return b.days.map(function(d){ return WD[d]; }).join("·") + " " + hourText(b);
}
function parseDays(t){
  t = String(t || "").replace(/요일/g, "");
  if (/매일|everyday/i.test(t)) return [0,1,2,3,4,5,6];
  var out = [];
  for (var i = 0; i < t.length; i++) { var d = DAYCH.indexOf(t[i]); if (d >= 0 && out.indexOf(d) < 0) out.push(d); }
  return out.sort();
}
function parseHours(t){
  return String(t == null ? "" : t).split(/[^0-9]+/).filter(function(x){ return x !== ""; }).map(Number).filter(function(h){ return h >= 0 && h <= 23; });
}

function occ(b, t){
  var out = [], base = kMid(t);
  for (var i = -2; i <= 8; i++) {
    var day = base + i * D, wd = k(day).getUTCDay();
    if (b.days.indexOf(wd) < 0) continue;
    for (var j = 0; j < b.hours.length; j++) out.push(day + b.hours[j] * H + (b.minute || 0) * M);
  }
  return out.sort(function(a, c){ return a - c; });
}
function compute(b, now){
  if (b.type === "fixed") {
    var start = b.startAt || 0, list = occ(b, Math.max(now, start)), last = null, next = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i] < start) continue;
      if (list[i] <= now) last = list[i];
      else if (next === null) next = list[i];
    }
    return {st:"up", at:next, certain:true, pending: now < start, recent: (last !== null && now - last < RECENT) ? last : null};
  }
  if (!b.anchor) return {st:"unknown", why:"시간 미등록"};
  if (now < b.anchor) return {st:"up", at:b.anchor, certain:true};
  var iv = b.interval ? b.interval * M + killMs(b) : 0;
  if (!iv) {
    return {st:"unknown", why:"리젠 주기 미정", recent: now - b.anchor < RECENT ? b.anchor : null};
  }
  var n = Math.floor((now - b.anchor) / iv), lastR = b.anchor + n * iv;
  return {st:"up", at:lastR + iv, certain:false, recent: now - lastR < RECENT ? lastR : null};
}
function recentText(c, now){
  if (!c.recent) return "";
  var ago = Math.floor((now - c.recent) / M);
  return (ago < 1 ? "방금" : ago + "분 전") + " 출현";
}
function texts(b, c, now){
  if (c.st === "live") return {hm:"출현", dy: c.aliveSeen ? "스샷 확인" : hm(c.since), lf:"출현 중", tg: c.aliveSeen ? "처치 시각 미기록" : since(now - c.since)};
  if (c.st === "recent") {
    var ago = Math.floor((now - c.since) / M);
    return {hm:hm(c.since), dy:"출현", lf:(ago < 1 ? "방금" : ago + "분 전") + " 출현", tg: c.next ? "다음 " + dayLabel(c.next, now) + " " + hm(c.next) + (b.type === "fixed" ? "" : " 예상") : (b.type === "fixed" ? fixedLabel(b) : cycLabel(b))};
  }
  if (c.st === "up") return {hm:hm(c.at), dy:dayLabel(c.at, now), lf:left(c.at - now) + " 후", tg: b.type === "fixed" ? fixedLabel(b) + (c.pending ? " · 10/14부터" : "") : cycLabel(b)};
  return {hm:"—", dy:"미정", lf:c.why, tg: b.type === "fixed" ? fixedLabel(b) : cycLabel(b)};
}
var SOON = 60 * M;
function isSoon(b, c, now){ return b.enabled && c.st === "up" && c.at - now <= SOON; }
function isUrgent(b, c, now){ return b.enabled && c.st === "up" && c.at - now <= URGENT; }

/* ---------- render ---------- */
var app = document.getElementById("app");
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]; }); }

function rowHtml(b, c, now){
  var t = texts(b, c, now), cls = ["row", b.type === "fixed" ? "fixed" : "respawn"];
  if (!b.enabled) cls.push("off");

  h += '<div class="rt"><div class="lf num" data-f="lf">' + esc(t.lf) + '</div><div class="tg" data-f="tg">' + esc(t.tg) + '</div></div>';

  if (admin) {

    if (!b.enabled) h += '<input class="field" type="text" maxlength="60" data-note="' + b.id + '" value="' + esc(b.note || "") + '" placeholder="안내 문구 (예: 통제로 인해 불가)" aria-label="' + esc(b.name) + ' 안내 문구">';

    h += '</div>';
  }
  return h + '</div>';
}

function sortKey(x){ return x.c.st === "live" ? -1 : x.c.st === "up" ? x.c.at : x.c.st === "recent" ? 9e15 + x.c.since : Infinity; }
function snapshot(now){
  return state.bosses.map(function(b){ return {b:b, c:compute(b, now)}; });
}
function signature(items, now){
  return items.map(function(x){ return x.b.id + x.c.st + (x.c.at || "") + isSoon(x.b, x.c, now) + isUrgent(x.b, x.c, now) + (x.c.recent ? "r" : ""); }).join("|") + tab + admin;
}

function heroData(items, now){
  var on = items.filter(function(x){ return x.b.enabled && x.c.st === "up"; }).sort(function(a, c){ return a.c.at - c.c.at; });
  if (!on.length) return null;
  var nx = on[0], same = on.filter(function(x){ return x.c.at === nx.c.at; });
  var win = nx.b.type === "respawn" && nx.b.interval ? nx.b.interval * M : 12 * H;
  var p = Math.max(0, Math.min(1, 1 - (nx.c.at - now) / win));
  return {x:nx, names: same.map(function(s){ return s.b.name; }).join(", "), p:p};
}
var RC = 2 * Math.PI * 58;

function render(){
  if (LIVE && !bossLoaded) {
    app.innerHTML = '<div class="wrap"><div class="g-loading glass" role="status"><span class="spin" aria-hidden="true"></span>보스 시간을 불러오는 중…</div></div>';

  }

  var vis = items.filter(function(x){ return tab === "all" || x.b.region === tab; });
  var resp = vis.filter(function(x){ return x.b.enabled && x.b.type === "respawn"; }).sort(function(a, c){ return sortKey(a) - sortKey(c); });
  var fixd = vis.filter(function(x){ return x.b.enabled && x.b.type === "fixed"; }).sort(function(a, c){ return sortKey(a) - sortKey(c); });
  var off = vis.filter(function(x){ return !x.b.enabled; }).sort(function(a, c){ return sortKey(a) - sortKey(c); });
  var nk = k(now);

  var h = '<div class="wrap">';

  var hd = heroData(items, now);
  if (hd) {
    var nb = hd.x.b, soon = hd.x.c.at - now <= SOON, urgent = hd.x.c.at - now <= URGENT;

    h += '<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><defs><linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d08a"/><stop offset="1" stop-color="#c48d3a"/></linearGradient></defs><circle class="track" cx="66" cy="66" r="58" fill="none" stroke-width="10"/><circle class="bar" id="ringBar" cx="66" cy="66" r="58" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + RC.toFixed(1) + '" stroke-dashoffset="' + (RC * (1 - hd.p)).toFixed(1) + '" transform="rotate(-90 66 66)"/></svg>';
    h += '<div class="mid"><div class="big num" id="heroLeft">' + clockLeft(hd.x.c.at - now) + '</div><div class="cap">남음</div></div></div>';
    h += '<div style="min-width:0"><div class="lbl">다음 보스</div><div class="who">' + esc(hd.names) + '</div>';
    h += '<div class="meta">' + (nb.lv ? "Lv." + nb.lv + " · " : "") + esc(RNAME[nb.region]) + " · " + (nb.type === "fixed" ? "고정 출현" : "리젠" + (hd.x.c.certain ? "" : " · 예상 시간")) + '</div>';
    h += '<div class="at num">' + hm(hd.x.c.at) + '</div><div class="atd">' + dayLabel(hd.x.c.at, now) + ' 출현</div></div></section>';

  else if (lives.length) h += '<div class="tile glass live"><div class="k">지금 출현 중</div><div class="v">' + lives.map(function(x){ return esc(x.b.name); }).join("<br>") + '</div></div>';
  else h += '<div class="tile glass"><div class="k">시간 기준</div><div class="v" style="font-size:15px;font-weight:700;font-family:var(--sans)">' + fullDate(state.baseTime) + '</div><div class="k">' + esc(state.baseLabel || "") + '</div></div>';
  h += '</div>';

  if (admin) {

    setTimeout(checkBuild, 0);

    h += '<div class="line"><select class="field" id="bulkRegion" aria-label="지역">' + REGIONS.slice(1).map(function(r){ return '<option value="' + r[0] + '">' + r[1] + '</option>'; }).join("") + '</select>';

  }

  if (tab !== "all") {

    if (regAll.length && regAll.every(function(x){ return !x.b.enabled; })) {
      var notes = regAll.map(function(x){ return x.b.note; }).filter(Boolean), uniq = notes.filter(function(n, i){ return notes.indexOf(n) === i; });

    }
  }

  function section(kind, icon, title, desc, list, emptyMsg){

    return s + '</section>';
  }
  h += section("respawn", IC_CYCLE, "리젠 보스", "정해진 주기로 다시 출현해요. 스크린샷 기준으로 계산합니다.", resp, "알림이 켜진 리젠 보스가 없습니다.");
  h += section("fixed", IC_CAL, "고정 출현 보스", "요일과 시간이 정해져 있어요.", fixd, "알림이 켜진 고정 출현 보스가 없습니다.");
  h += section("off", IC_OFF, "진행하지 않는 보스", "관리자가 알림을 끈 보스입니다.", off, "");

  h += '<footer><p>"예상"이 붙은 시간은 마지막 출현 시각에 리젠 주기를 더한 값이라 처치 시점에 따라 달라질 수 있어요.</p>';
  h += '<p>심연의 틈은 하루 1회 참여, 참여 보상은 매일 5시에 초기화됩니다.</p>';
  var CONN = {live:"실시간 연결됨", connecting:"연결 중…", error:"서버 연결 실패 · 잠시 후 새로고침해 주세요", preview:"미리보기 모드 · 저장되지 않음"};
  h += '<p>마지막 수정 ' + fullDate(state.updatedAt) + ' · ' + CONN[conn] + (clockOk && Math.abs(clockOff) >= 2000 ? ' · 이 기기 시계 ' + Math.round(Math.abs(clockOff) / 1000) + '초 ' + (clockOff > 0 ? '느림' : '빠름') + ' (자동 보정됨)' : '') + '</p>';
  h += '<p class="contact">문의 · 홍신나</p></footer></div>';

  var bulkR = document.getElementById("bulkRegion"), bulkN = document.getElementById("bulkNote");
  var keep = bulkR ? {r:bulkR.value, n:bulkN.value} : null;
  app.innerHTML = h;
  if (keep && admin) { document.getElementById("bulkRegion").value = keep.r; document.getElementById("bulkNote").value = keep.n; }
  renderSaveBar();
  renderLock();

}

/* ---------- 필드 보스 통제 팝업: 삭제됨 (호환용 빈 함수) ---------- */
function savedLock(){ return { on: false, main: LOCK_MAIN, sub: LOCK_SUB, note: "" }; }
function renderLock(){}

function editing(){
  var a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA") && app.contains(a);
}
function tick(){
  if (LIVE && !bossLoaded) return;
  var now = nowT(), items = snapshot(now);
  if (signature(items, now) !== lastSig && !editing() && !dlg.open) { render(); return; }
  var nk = k(now), c = document.getElementById("clk");
  if (c) c.textContent = hm(now) + ":" + pad(nk.getUTCSeconds());
  items.forEach(function(x){
    var el = app.querySelector('[data-row="' + x.b.id + '"]'); if (!el) return;
    var t = texts(x.b, x.c, now);
    el.querySelector('[data-f="lf"]').textContent = t.lf;
    el.querySelector('[data-f="tg"]').textContent = t.tg;
    var rb = el.querySelector('[data-f="rb"]'); if (rb) rb.textContent = recentText(x.c, now);
  });
  var hd = heroData(items, now), hl = document.getElementById("heroLeft"), rb = document.getElementById("ringBar");
  if (hd && hl) { hl.textContent = clockLeft(hd.x.c.at - now); rb.setAttribute("stroke-dashoffset", (RC * (1 - hd.p)).toFixed(1)); }
}

/* ---------- save bar ---------- */
var bar = document.createElement("div");
bar.className = "savebar glass"; bar.hidden = true;
document.body.appendChild(bar);
function renderSaveBar(){
  bar.hidden = !(admin && dirty);
  if (bar.hidden) return;
  bar.innerHTML = '<div class="msg">' + esc(saveMsg || "저장하지 않은 변경사항이 있습니다.") + '</div><button class="btn" data-act="revert">되돌리기</button>' + (canWrite ? '<button class="btn primary" data-act="save">변경사항 저장</button>' : "");
}
function touch(full){
  state.updatedAt = nowT();
  dirty = JSON.stringify(state) !== saved; saveMsg = "";

}

/* ---------- dialogs ---------- */
var dlg = document.createElement("dialog");
document.body.appendChild(dlg);

}

  dlgOk = onOk;
  showDlg();
  var f = dlg.querySelector("input"); if (f) f.focus();

function guessTime(file){

  if (file.lastModified) return {t: Math.floor(file.lastModified / 1000) * 1000, src:"파일 수정한 날짜"};

function parseDateText(t, fallback){
  t = String(t || "").trim();
  if (!t) return null;
  var y, mo, d, h = null, mi = 0, se = 0, m;
  if ((m = t.match(/(20\d{2})(\d{2})(\d{2})[_\-T ]?(\d{2})(\d{2})(\d{2})?/))) {
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0);
  } else {
    if ((m = t.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/)) || (m = t.match(/(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    var tm = t.match(/(오전|오후|AM|PM|am|pm)?\s*(\d{1,2})\s*[:시]\s*(\d{1,2})\s*(?:[:분]\s*(\d{1,2}))?/);
    if (tm && !(y && tm.index < (m ? m.index + m[0].length : 0))) {
      h = +tm[2]; mi = +tm[3]; se = +(tm[4] || 0);
      var ap = (tm[1] || "").toLowerCase();
      if ((ap === "오후" || ap === "pm") && h < 12) h += 12;
      if ((ap === "오전" || ap === "am") && h === 12) h = 0;
    }
    if (!y && fallback != null) { var f = k(fallback); y = f.getUTCFullYear(); mo = f.getUTCMonth() + 1; d = f.getUTCDate(); }
  }
  if (!y || h === null || mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59 || se > 59) return null;
  return Date.UTC(y, mo - 1, d, h, mi, se) - KST;
}

  return Array.isArray(arr) ? arr : [];
}

}

function applyShot(){

    if (!tr.querySelector(".ap").checked) return;
    var b = find(tr.getAttribute("data-b")); if (!b) return;
    if (tr.getAttribute("data-t") === "r") {
      var sel = tr.querySelector(".src"), base = shot.bases[sel ? +sel.value : 0];
      if (tr.querySelector(".lv").checked) { b.alive = false; b.anchor = base; }
      else {
        var h = tr.querySelector(".rh").value, m = tr.querySelector(".rm").value, sc = tr.querySelector(".rs").value;
        if (h === "" && m === "" && sc === "") { bad.push(b.name); return; }
        b.alive = false; b.anchor = base + shotOffset(h, m, sc);
      }
      used.push(base);
    } else {
      var days = parseDays(tr.querySelector(".fdays").value), hours = parseHours(tr.querySelector(".fhrs").value);
      if (!days.length || !hours.length) { bad.push(b.name); return; }
      b.days = days; b.hours = hours; b.minute = Math.max(0, Math.min(59, +tr.querySelector(".fmin").value || 0));
    }
    n++;
  });

  if (!n) { note.textContent = "저장할 보스를 하나 이상 체크해 주세요."; note.style.color = "#ff6a5c"; return; }

}

/* ---------- save (Firestore) ---------- */
function save(){
  if (!LIVE) { saveMsg = "미리보기 모드라 저장되지 않아요. 설정에 Firebase 값을 넣어 주세요."; renderSaveBar(); toast(saveMsg, "bad"); return; }
  saveMsg = "저장 중…"; renderSaveBar();
  var json = JSON.stringify(state);
  docRef.set({ json: json, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).then(function(){
    saved = json; dirty = false; saveMsg = ""; render();
    toast("저장했습니다. 길드원 화면에 반영됩니다.", "ok");
  }).catch(function(err){
    var c = err && err.code;
    if (c === "permission-denied") saveMsg = "저장 권한이 없어요. 관리자 로그인을 다시 해 주세요.";
    else if (c === "unavailable") saveMsg = "서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.";
    else saveMsg = "저장하지 못했어요 (" + (c || "오류") + "). 다시 시도해 주세요.";
    renderSaveBar(); toast(saveMsg, "bad");
  });
}

/* ---------- view counter (every load / refresh) ---------- */
function dayKey(ms){ var d = k(ms); return "day_" + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()); }
function countView(){
  if (!statsCol) return;
  try {
    var inc = firebase.firestore.FieldValue.increment(1), b = firebase.firestore().batch();
    b.set(statsCol.doc("total"), { count: inc }, { merge: true });
    b.set(statsCol.doc(dayKey(nowT())), { count: inc }, { merge: true });
    b.commit().catch(function(e){ console.warn("조회수 기록 실패", e); });
  } catch (e) {}
}
function watchViews(on){
  if (!statsCol) return;
  if (on && !viewsUnsub) {
    var now = nowT(), ids = ["total", dayKey(now), dayKey(now - D)], vals = {}, subs;
    subs = ids.map(function(id){
      return statsCol.doc(id).onSnapshot(function(snap){
        vals[id] = snap.exists ? (snap.data().count || 0) : 0;

        var el = document.getElementById("viewStats"); if (el) el.innerHTML = viewsHtml();

}
function viewsHtml(){

  var f = function(n){ return (n == null ? 0 : n).toLocaleString("ko-KR"); };
  return '<span>오늘 <b>' + f(views.today) + '</b></span><span>어제 <b>' + f(views.yesterday) + '</b></span><span>누적 <b>' + f(views.total) + '</b></span>';

    return;
  }
  if (act === "kill" && b) { b.alive = false; b.anchor = b.interval ? Math.round(nowT() / 1000) * 1000 + b.interval * M : null; touch(); return; }
  if (act === "time" && b) return timeDlg(b);
  if (act === "ftime" && b) return fixedDlg(b);
  if (act === "bulkoff" || act === "bulkon") {
    var r = document.getElementById("bulkRegion").value, n = document.getElementById("bulkNote").value.trim();
    state.bosses.forEach(function(x){ if (x.region === r) { x.enabled = act === "bulkon"; if (act === "bulkoff" && n) x.note = n; } });
    touch(); return;
  }
  if (act === "revert") { state = migrate(JSON.parse(saved)); dirty = false; saveMsg = ""; render(); return; }
  if (act === "save") return save();
}
app.addEventListener("click", onClick);
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); installEvt = e; render(); });
window.addEventListener("appinstalled", function(){ installEvt = null; render(); toast("홈 화면에 추가했어요.", "ok"); });
bar.addEventListener("click", onClick);
app.addEventListener("input", function(e){
  var id = e.target.getAttribute && e.target.getAttribute("data-note");
  if (!id) return;
  var b = find(id); if (!b) return;
  b.note = e.target.value; touch(false);
});
window.addEventListener("beforeunload", function(e){ if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- 상단 제목줄 (보스 스케쥴표 전용) ---------- */
var gTop = document.getElementById("gTop"), gMenuOpen = false;
var G_IC_MORE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
function gRenderShell(){
  var h = '<div class="g-top-in"><div style="min-width:0"><div class="game">제우스: 오만의신 · 홍신나 전용페이지</div><h1>보스 스케쥴표</h1></div><div class="g-hr">';
  if (admin) h += '<span class="mode admin" role="status"><span class="dot"></span>관리자</span>';
  h += '<button class="g-ic" data-g="menu" aria-label="더보기" aria-haspopup="true" aria-expanded="' + gMenuOpen + '">' + G_IC_MORE + '</button></div></div>';
  if (gMenuOpen) {
    h += '<div class="g-menu glass" role="menu">' +
      (admin ? '<button role="menuitem" data-act="logout">로그아웃</button>' : '<button role="menuitem" data-act="login">관리자 로그인</button>') +
      (isStandalone() ? '' : '<button role="menuitem" data-act="install">홈 화면에 추가</button>') + '</div>';
  }
  gTop.innerHTML = h;
}
gTop.addEventListener("click", function(e){
  var g = e.target.closest('[data-g="menu"]');
  if (g) { gMenuOpen = !gMenuOpen; gRenderShell(); if (gMenuOpen) { var f = gTop.querySelector(".g-menu button"); if (f) f.focus(); } return; }
  if (e.target.closest("[data-act]")) { gMenuOpen = false; gRenderShell(); onClick(e); }
});
document.addEventListener("click", function(e){
  if (gMenuOpen && !e.target.closest(".g-menu") && !e.target.closest('[data-g="menu"]')) { gMenuOpen = false; gRenderShell(); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && gMenuOpen) { gMenuOpen = false; gRenderShell(); var b = gTop.querySelector('[data-g="menu"]'); if (b) b.focus(); }
});
try { localStorage.removeItem("guild-seen"); localStorage.removeItem("guild-likes"); } catch (e) {}

/* ---------- 자동 업데이트: 새 버전이 올라오면 알아서 새로고침 ---------- */
var lastUpdCheck = 0;
function autoUpdate(force){
  var t = Date.now();
  if (!force && t - lastUpdCheck < 60000) return; // 1분에 한 번까지만 확인
  lastUpdCheck = t;
  fetch(location.pathname + "?vcheck=" + t, { cache: "no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = txt.match(/var BUILD = "([^"]+)"/); if (!m) return;
    latestBuild = m[1]; buildChecked = true;
    var el = document.getElementById("verBox"); if (el) el.innerHTML = verHtml();
    if (m[1] <= BUILD) return;                                  // 지금 보는 게 최신
    if (dirty || dlg.open || editing()) return; // 작성·수정 중이면 다음에 다시
    var tried = null; try { tried = sessionStorage.getItem("boss-upd"); } catch (e) {}
    if (tried === m[1]) return;                                  // 같은 버전으로는 한 번만 시도
    try { sessionStorage.setItem("boss-upd", m[1]); } catch (e) {}
    // 주소에 버전을 붙여 옛 파일을 건너뛰고, #notice 같은 메뉴 주소는 그대로 유지
    location.replace(location.pathname + "?v=" + m[1].replace(/\D/g, "") + location.hash);
  }).catch(function(){});
}

render();
setInterval(tick, 1000);
setTimeout(function(){ autoUpdate(true); }, 3000);
setInterval(function(){ autoUpdate(true); }, 5 * M);
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") autoUpdate(); });
window.addEventListener("pageshow", function(e){ if (e.persisted) autoUpdate(true); });
syncClock(); setInterval(syncClock, 10 * M);
})();
</script>
