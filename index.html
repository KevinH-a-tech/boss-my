var G_INTRO = "처음 오신 분 환영해요! 우리 길드가 한 주 동안 어떻게 움직이는지 아래에서 확인해 주세요.";
var gDb = LIVE ? firebase.firestore() : null;
var G_KINDS = { guild: "길드 활동", meet: "모임 · 정산", etc: "기타" };

function gRows(snap){
  return snap.docs.map(function(d){
    var x = d.data({ serverTimestamps: "estimate" }) || {}, ts = x.createdAt;
    return { id: d.id, title: String(x.title || ""), body: String(x.body || ""), author: String(x.author || ""),
      links: Array.isArray(x.links) ? x.links.filter(gSafeUrl).slice(0, 3) : [], images: Math.max(0, Math.min(3, +x.images || 0)),
      likes: Math.max(0, +x.likes || 0), at: ts && ts.toMillis ? ts.toMillis() : nowT(),
      pinned: x.pinned === true, pinAt: x.pinAt && x.pinAt.toMillis ? x.pinAt.toMillis() : 0 };
  });
}
function gOkEvent(e){ return e && typeof e.title === "string" && /^\d{2}:\d{2}$/.test(e.time) && Array.isArray(e.days); }
function gOnData(kind){ if (gView === kind) { gMarkSeen(); gRenderView(true); } gRenderNav(); }
if (LIVE) {
  gDb.collection("notices").orderBy("createdAt", "desc").limit(50).onSnapshot(function(s){
    gNotices = gRows(s); gLoaded.notice = true; delete gErr.notice; gOnData("notice");
  }, function(e){ gLoaded.notice = true; gErr.notice = (e && e.code) || "error"; gOnData("notice"); });
  gDb.collection("tips").orderBy("createdAt", "desc").limit(100).onSnapshot(function(s){
    gTips = gRows(s); gLoaded.tips = true; delete gErr.tips; gOnData("tips");
  }, function(e){ gLoaded.tips = true; gErr.tips = (e && e.code) || "error"; gOnData("tips"); });
  gDb.collection("guild").doc("schedule").onSnapshot(function(s){
    var x = s.exists ? s.data() : {};
    gSched = { intro: typeof x.intro === "string" ? x.intro : "", events: Array.isArray(x.events) ? x.events.filter(gOkEvent) : [] };
    gLoaded.schedule = true; delete gErr.schedule; gOnData("schedule");
  }, function(e){ gLoaded.schedule = true; gErr.schedule = (e && e.code) || "error"; gOnData("schedule"); });
}
function gErrMsg(e){
  var c = e && e.code;
  if (c === "permission-denied") return "권한이 없어 저장하지 못했어요." + (admin ? "" : " 관리자 로그인이 필요한 기능일 수 있어요.");
  if (c === "unavailable") return "서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.";
  return "저장하지 못했어요. 잠시 후 다시 시도해 주세요.";
}
function gCountNew(list, since){ var c = 0; list.forEach(function(p){ if (p.at > since) c++; }); return c; }
function gMarkSeen(){
  var list = gView === "notice" ? gNotices : gView === "tips" ? gTips : null;
  if (!list || !gLoaded[gView]) return;
  var top = nowT(); list.forEach(function(p){ if (p.at > top) top = p.at; });
  if (gSeen[gView] !== top) { gSeen[gView] = top; gSet("guild-seen", gSeen); }
}

/* ---------- 상단 · 하단 메뉴 ---------- */
var gLastAdmin = null;
function gRenderShell(){ gRenderTop(); gRenderNav(); gCheckAutoEntry(); }
function gRenderTop(){
  var h = '<div class="g-top-in"><div style="min-width:0"><div class="game">제우스: 오만의신 · 홍신나 전용페이지</div><h1>' + V_TITLE[gView] + '</h1></div><div class="g-hr">';
  if (admin) h += '<span class="mode admin" role="status"><span class="dot"></span>관리자</span>';
  h += '<button class="g-ic" data-g="copy" aria-label="지금 메뉴 링크 복사" title="지금 메뉴 링크 복사">' + G_IC_LINK + '</button>';
  h += '<button class="g-ic" data-g="menu" aria-label="더보기" aria-haspopup="true" aria-expanded="' + gMenuOpen + '">' + G_IC_MORE + '</button></div></div>';
  if (gMenuOpen) {
    h += '<div class="g-menu glass" role="menu">' +
      (admin ? '<button role="menuitem" data-act="logout">로그아웃</button>' : '<button role="menuitem" data-act="login">관리자 로그인</button>') +
      (isStandalone() ? '' : '<button role="menuitem" data-act="install">홈 화면에 추가</button>') +
      '<button role="menuitem" data-g="copy">지금 메뉴 링크 복사</button></div>';
  }
  gTop.innerHTML = h;
  if (gLastAdmin !== admin) { gLastAdmin = admin; if (gView !== "boss") gRenderView(); }
}
function gRenderNav(){
  var nb = { notice: gCountNew(gNotices, gSeen.notice), tips: gCountNew(gTips, gSeen.tips) };
  gNav.innerHTML = V_ORDER[gEntry].map(function(v){
    var on = admin ? (v === "boss" || state.menus[v] === true) : menuOn(v);
    var c = v === gView || !on ? 0 : (nb[v] || 0);
    return '<button class="gnav-b' + (on ? '' : ' off') + '" data-view="' + v + '"' + (v === gView ? ' aria-current="page"' : '') + (!on && !admin ? ' disabled aria-disabled="true"' : '') + '>' + V_IC[v] + '<span>' + V_SHORT[v] + (on ? '' : '<small class="gnav-off">꺼짐</small>') + '</span>' +
      (c ? '<span class="gnav-badge num" aria-label="새 글 ' + c + '개">' + (c > 9 ? "9+" : c) + '</span>' : '') + '</button>';
  }).join("");
}
function gSetView(v){
  if (!V_ORDER[v]) return;
  if (!admin && !menuOn(v)) return;
  gView = v; gMenuOpen = false; gNDetail = null; gTDetail = null;
  if (gNHashDetail()) { try { history.replaceState(null, "", "#" + v); } catch (e) {} }
  app.hidden = v !== "boss";
  Object.keys(gViewEl).forEach(function(key){ gViewEl[key].hidden = key !== v; });
  gMarkSeen();
  if (v === "boss") render(); else { gRenderShell(); gRenderView(); renderLock(); }
  window.scrollTo(0, 0);
}
function gCopyLink(){
  if (gView === "notice" && gNDetail) return gCopyNotice(gNDetail);
  gCopyUrl(gView, V_SHORT[gView] + " 링크를 복사했어요.");
}
function gCopyUrl(hash, msg){
  var u = location.origin + location.pathname + "#" + hash;
  var ok = function(){ toast(msg, "ok"); };
  var fallback = function(){ window.prompt("아래 링크를 복사하세요", u); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(ok, fallback); else fallback();
}
gTop.addEventListener("click", function(e){
  var g = e.target.closest("[data-g]");
  if (g && g.getAttribute("data-g") === "menu") { gMenuOpen = !gMenuOpen; gRenderTop(); if (gMenuOpen) { var f = gTop.querySelector(".g-menu button"); if (f) f.focus(); } return; }
  if (g && g.getAttribute("data-g") === "copy") { gMenuOpen = false; gRenderTop(); gCopyLink(); return; }
  if (e.target.closest("[data-act]")) { gMenuOpen = false; gRenderTop(); onClick(e); }
});
document.addEventListener("click", function(e){
  if (gMenuOpen && !e.target.closest(".g-menu") && !e.target.closest('[data-g="menu"]')) { gMenuOpen = false; gRenderTop(); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && gMenuOpen) { gMenuOpen = false; gRenderTop(); var b = gTop.querySelector('[data-g="menu"]'); if (b) b.focus(); }
});
gNav.addEventListener("click", function(e){ var b = e.target.closest("[data-view]"); if (b) { gUserNav = true; gSetView(b.getAttribute("data-view")); } });

/* ---------- 각 메뉴 화면 ---------- */
var gForms = { notice: null, tips: null, schedule: null };
var gOpenOld = {}, gTipSort = "new", gShowBoss = false, gIntroEdit = null;

function gRenderView(listOnly){
  var el = gViewEl[gView]; if (!el) return;
  if (!admin) { gForms.notice = null; if (gForms.schedule) gForms.schedule = null; gIntroEdit = null; }
  if (!el.firstChild) el.innerHTML = '<div class="wrap"><div class="g-slot" data-slot="head"></div><div class="g-slot" data-slot="form"></div><div class="g-slot" data-slot="list"></div></div>';
  var slot = function(n){ return el.querySelector('[data-slot="' + n + '"]'); };
  var fn = gView === "notice" ? [gNoticeHead, gNoticeForm, gNoticeList] : gView === "tips" ? [gTipsHead, gTipsForm, gTipsList] : [gSchedHead, gSchedForm, gSchedList];
  slot("head").innerHTML = fn[0]();
  if (!listOnly) slot("form").innerHTML = fn[1]();
  slot("list").innerHTML = fn[2]();
}
function gRenderForm(){ var el = gViewEl[gView]; if (!el || !el.firstChild) return gRenderView(); var s = el.querySelector('[data-slot="form"]'); s.innerHTML = gView === "notice" ? gNoticeForm() : gView === "tips" ? gTipsForm() : gSchedForm(); }
function gStatus(kind, emptyMsg, list){
  if (!gLoaded[kind]) return '<div class="g-empty">불러오는 중…</div>';
  if (gErr[kind]) return '<div class="g-empty">글을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>';
  if (list && !list.length) return '<div class="g-empty">' + emptyMsg + '</div>';
  return "";
}
function gLikeBtn(kind, p){
  var on = !!gLiked[kind + ":" + p.id];
  return '<button class="g-like" data-g="like" data-k="' + kind + '" data-id="' + esc(p.id) + '" aria-pressed="' + on + '" aria-label="좋아요 ' + p.likes + '개' + (on ? ', 내가 누름' : '') + '">' + G_IC_HEART + '<span class="num">' + p.likes + '</span></button>';
}
function gDelBtn(kind, id){ return admin ? '<button class="g-del" data-g="del" data-k="' + kind + '" data-id="' + esc(id) + '">삭제</button>' : ''; }
function gField(kind, f, label, req, tag, attrs, val, err){
  var id = "gf-" + kind + "-" + f;
  var input = tag === "textarea"
    ? '<textarea class="field g-in' + (err ? ' bad' : '') + '" id="' + id + '" data-gf="' + f + '" data-k="' + kind + '" ' + attrs + '>' + esc(val) + '</textarea>'
    : '<input class="field g-in' + (err ? ' bad' : '') + '" id="' + id + '" data-gf="' + f + '" data-k="' + kind + '" ' + attrs + ' value="' + esc(val) + '">';
  return '<div><label class="g-l" for="' + id + '">' + label + (req ? ' <span class="g-req">*</span>' : ' <span class="g-opt">(선택)</span>') + '</label>' + input + '<div class="g-err" id="' + id + '-err">' + (err || '') + '</div></div>';
}
function gActs(kind, okLabel, busy){
  return '<div class="g-acts"><button class="btn" data-g="cancel" data-k="' + kind + '">취소하기</button><button class="btn primary" data-g="submit" data-k="' + kind + '"' + (busy ? ' disabled' : '') + '>' + (busy ? '저장 중…' : okLabel) + '</button></div>';
}

/* 공지 */
var G_IC_PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 3l6 6-3 1-4 4 1 5-2 1-4-4-5 5-1-1 5-5-4-4 1-2 5 1 4-4z"/></svg>';
function gLinkify(t){
  return esc(t).replace(/https?:\/\/[^\s<]+/g, function(u){
    if (/#raid$/.test(u)) return '<a href="#raid" data-g="raid">분배 방식 자세히 보기 ↗</a>';
    return '<a href="' + u + '" target="_blank" rel="noopener noreferrer nofollow">' + u.replace(/^https?:\/\//i, "") + '</a>';
  });
}
function gNoticeFoot(p){
  return '<div class="g-foot">' + gLikeBtn("n", p) + '<button class="g-pinbtn" data-g="ncopy" data-id="' + esc(p.id) + '">🔗 링크 복사</button>' + (admin ? '<button class="g-pinbtn" data-g="pin" data-id="' + esc(p.id) + '" aria-pressed="' + !!p.pinned + '">' + (p.pinned ? '고정 해제' : '📌 고정') + '</button><button class="g-del g-edit" data-g="nedit" data-id="' + esc(p.id) + '">수정</button>' + gDelBtn("n", p.id) : '') + '</div>';
}
function gNoticeHead(){
  if (gNDetail) return '<div class="g-bar"><button class="btn" data-g="nback">← 공지 목록</button>' + (gNDetail === "raid" ? '<button class="btn" data-g="ncopy" data-id="raid">🔗 링크 복사</button>' : '') + '</div>';
  return admin && !gForms.notice ? '<div class="g-bar"><span></span><button class="btn primary" data-g="write" data-k="notice">+ 공지 작성</button></div>' : '';
}
function gNoticeForm(){
  var d = gForms.notice; if (!d || (gNDetail && !d.id)) return '';
  return '<section class="g-form" aria-label="' + (d.id ? '공지 수정' : '공지 작성') + '"><h3>' + (d.id ? '공지 수정' : '새 공지 작성') + '</h3>' +
    gField("notice", "title", "제목", true, "input", 'maxlength="60"', d.title, d.errs.title) +
    gField("notice", "body", "내용", true, "textarea", 'maxlength="3000" rows="6"', d.body, d.errs.body) +
    gField("notice", "author", "작성자", true, "input", 'maxlength="20" autocomplete="nickname"', d.author, d.errs.author) +
    '<p class="g-hint">' + (d.id ? '수정해도 <b>처음 공지한 시각, 좋아요, 고정 상태</b>는 그대로 유지돼요.' : '공지 시각은 <b>공지하기를 누른 순간</b>으로 초 단위까지 기록돼요.') + ' 내용에 주소(https://…)를 쓰면 자동으로 링크가 돼요.</p>' + gActs("notice", d.id ? "수정하기" : "공지하기", d.busy) + '</section>';
}
/* 게시판: 최신 공지 1개는 크게, 나머지(고정 · 이전 공지)는 한 줄 목록 → 누르면 글 보기 화면 */
var gNDetail = null; // null(목록) | "raid"(분배 안내글) | 공지 id
function gNRow(p){
  return '<div class="g-old"><button class="g-old-h" data-g="nopen" data-id="' + esc(p.id) + '"><span class="d num">' + gMD(p.at) + '</span><span class="tt">' +
    (p.pinned ? '<span class="n-tag pin">고정</span>' : '') + esc(p.title) + '</span><span class="lk num" aria-label="좋아요 ' + p.likes + '개">♥ ' + p.likes + '</span><span class="cv" aria-hidden="true">›</span></button></div>';
}
function gNoticeList(){
  if (gNDetail) return gNoticeDetail();
  var pins = [], rest = [];
  gNotices.forEach(function(p){ (p.pinned ? pins : rest).push(p); });
  pins.sort(function(a, b){ return b.pinAt - a.pinAt; });
  var h = '', st = gStatus("notice", "", null);
  if (st) h += st;
  else if (rest.length) {
    var p = rest[0];
    h += '<article class="g-latest"><span class="g-tag">📌 최신 공지</span><h3>' + esc(p.title) + '</h3><p class="g-body">' + gLinkify(p.body) + '</p>' +
      '<div class="g-meta"><span>공지 <b class="num">' + gStamp(p.at) + '</b></span><span>작성자 <b>' + esc(p.author) + '</b></span></div>' + gNoticeFoot(p) + '</article>';
  }
  h += '<section class="g-olds glass n-board" aria-label="공지 목록"><h4>고정 공지 ' + (pins.length + 1) + '개</h4>';
  h += '<div class="g-old"><button class="g-old-h" data-g="nopen" data-id="raid"><span class="d lab">안내</span><span class="tt"><span class="n-tag guide">고정</span>길드 레이드 분배 방식</span><span class="cv" aria-hidden="true">›</span></button></div>';
  pins.forEach(function(q){ h += gNRow(q); });
  if (rest.length > 1) {
    h += '<h4 class="sep">이전 공지 ' + (rest.length - 1) + '개</h4>';
    rest.slice(1).forEach(function(q){ h += gNRow(q); });
  }
  h += '</section>';
  if (!st && !gNotices.length) h += '<p class="g-soft">아직 작성된 공지가 없어요.</p>';
  return h;
}
function gNoticeDetail(){
  if (gForms.notice && gForms.notice.id && gForms.notice.id === gNDetail) return '';
  if (gNDetail === "raid") {
    return '<article class="n-detail n-guide-d" id="raid"><div class="n-dh"><span class="n-tag guide">고정 · 안내</span><h3 tabindex="-1">길드 레이드 분배 방식</h3></div>' + gRaidGuide() + '</article>' + gNoticeNav();
  }
  var p = gNFind(gNDetail);
  if (!p) return gStatus("notice", "", null) || '<div class="g-empty">삭제되었거나 찾을 수 없는 공지예요.</div>';
  gNDetail = p.id;
  return '<article class="g-latest n-detail">' + (p.pinned ? '<span class="g-tag">📌 고정 공지</span>' : '') + '<h3 tabindex="-1">' + esc(p.title) + '</h3><p class="g-body">' + gLinkify(p.body) + '</p>' +
    '<div class="g-meta"><span>공지 <b class="num">' + gStamp(p.at) + '</b></span><span>작성자 <b>' + esc(p.author) + '</b></span></div>' + gNoticeFoot(p) + '</article>' + gNoticeNav();
}
function gNoticeSeq(){
  var pins = [], rest = [];
  gNotices.forEach(function(p){ (p.pinned ? pins : rest).push(p); });
  pins.sort(function(a, b){ return b.pinAt - a.pinAt; });
  return [{ id: "raid", title: "길드 레이드 분배 방식" }].concat(pins, rest);
}
function gNavPair(list, idx, attr, noun){
  var nb = function(q, dir){
    var lab = dir === "prev" ? "이전 글" : "다음 글", arr = dir === "prev" ? "‹" : "›";
    if (!q) return '<button class="t-nb ' + dir + '" disabled><span class="ar" aria-hidden="true">' + arr + '</span><span class="tx"><small>' + lab + '</small><b>' + (dir === "prev" ? "첫 글이에요" : "마지막 글이에요") + '</b></span></button>';
    return '<button class="t-nb ' + dir + '" data-g="' + attr + '" data-id="' + esc(q.id) + '" aria-label="' + lab + ': ' + esc(q.title) + '"><span class="ar" aria-hidden="true">' + arr + '</span><span class="tx"><small>' + lab + '</small><b>' + esc(q.title) + '</b></span></button>';
  };
  return '<nav class="t-nav" aria-label="다른 ' + noun + '">' + nb(list[idx - 1], "prev") + nb(list[idx + 1], "next") + '</nav>';
}
function gNoticeNav(){
  var seq = gNoticeSeq(), idx = -1;
  seq.forEach(function(x, i){ if (x.id === gNDetail) idx = i; });
  if (idx < 0) return '';
  return gNavPair(seq, idx, "ngo", "공지") + '<p class="t-pos num">공지 ' + (idx + 1) + ' / ' + seq.length + '</p>';
}
/* 공지마다 고유 링크: …/boss/#notice-ab12cd (공지 생성 시 만들어지는 문서 id 앞 6자리) · 분배 안내글은 #raid */
function gNCode(id){ return id === "raid" ? "raid" : "notice-" + String(id).slice(0, 6); }
function gNHashDetail(){
  var h = location.hash || "";
  if (h === "#raid") return "raid";
  var m = h.match(/^#notice-([A-Za-z0-9_-]+)$/);
  return m ? m[1] : null;
}
function gNFind(code){
  var p = null;
  gNotices.forEach(function(x){ if (!p && (x.id === code || x.id.slice(0, 6) === code)) p = x; });
  return p;
}
function gCopyNotice(id){
  var p = id === "raid" ? null : gNFind(id);
  gCopyUrl(gNCode(p ? p.id : id), (id === "raid" ? "분배 방식" : "이 공지") + " 링크를 복사했어요.");
}
function gOpenNotice(id){
  gNDetail = id;
  try { history.pushState({ gd: 1 }, "", "#" + gNCode(id)); } catch (e) {}
  gRenderView(); window.scrollTo(0, 0);
  var t = gViewEl.notice.querySelector(".n-detail h3"); if (t) t.focus({ preventScroll: true });
}
function gCloseNotice(){
  if (history.state && history.state.gd) { history.back(); return; }
  try { history.replaceState(null, "", "#notice"); } catch (e) {}
  gNDetail = null; gRenderView(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", function(){
  if (gView !== "notice") return;
  var d = gNHashDetail();
  if (d !== gNDetail) { gNDetail = d; gRenderView(); window.scrollTo(0, 0); }
});

/* 꿀팁: 게시판 (목록에는 제목 · 작성자 · 좋아요, 내용은 글 보기 화면에서) */
var gTDetail = null;
function gTipsSorted(){ return gTips.slice().sort(function(a, b){ return gTipSort === "like" ? (b.likes - a.likes) || (b.at - a.at) : b.at - a.at; }); }
function gTipsHead(){

  return '<div class="g-bar"><div class="g-seg" role="group" aria-label="정렬"><button data-g="sort" data-v="new" aria-pressed="' + (gTipSort === "new") + '">최신순</button><button data-g="sort" data-v="like" aria-pressed="' + (gTipSort === "like") + '">좋아요순</button></div>' +
    (gForms.tips ? '' : '<button class="btn primary" data-g="write" data-k="tips">+ 꿀팁 쓰기</button>') + '</div>';
}
function gTipsForm(){
  var d = gForms.tips; if (!d || gTDetail) return '';

function gBossOn(dayIdx){
  var out = [], now = nowT(), src = state.bosses || [];
  src.forEach(function(b){
    if (b.type !== "fixed" || !Array.isArray(b.days) || !Array.isArray(b.hours) || !b.hours.length) return;
    if (!b.days.some(function(d){ return (d + 6) % 7 === dayIdx; })) return;
    var later = b.startAt && b.startAt > now, on = b.enabled && !later, desc;
    if (!b.enabled) desc = b.note || "진행하지 않음";
    else if (later) desc = gMD(b.startAt) + "부터 출현";
    else desc = (b.lv ? "Lv." + b.lv + " · " : "") + (b.loc || "");
    var times = b.hours.slice().sort(function(a, c){ return a - c; }).map(function(hh){ return pad(hh) + ":" + pad(b.minute || 0); });
    if (times.length > 1) desc = b.hours.join(" · ") + "시 · " + desc;
    out.push({ boss: true, on: on, title: b.name, time: times[0], n: times.length, desc: desc });
  });
  return out;
}
function gEventsOn(dayIdx){
  var list = gSched.events.filter(function(e){ return e.days.indexOf(dayIdx) >= 0; }).map(function(e){ return { e: e, time: e.time }; });
  if (gShowBoss) list = list.concat(gBossOn(dayIdx));
  return list.sort(function(a, b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
}

        var c = document.createElement("canvas"), sc = base * tries[i][0];

    img.src = url;

}

        gSaveSched({ intro: gSched.intro, events: gSched.events.filter(function(x){ return x.id !== id; }) }, "일정을 삭제했어요.").then(function(){ if (!LIVE) gRenderView(); }, function(){});
      });
    }
  });
  el.addEventListener("change", function(e){
    if (e.target.getAttribute("data-g") === "timg" && gForms.tips) {
      var d = gForms.tips, files = Array.prototype.slice.call(e.target.files || [], 0, G_IMG_MAX - d.imgs.length);
      if (!files.length) return;
      d.imgBusy = true; d.errs.img = ""; gRenderForm();
      files.reduce(function(pr, f){ return pr.then(function(){ return gCompressImage(f).then(function(u){ if (d.imgs.length < G_IMG_MAX) d.imgs.push(u); }, function(err){ d.errs.img = err && err.message === "type" ? "사진 파일만 올릴 수 있어요." : "이 사진은 올릴 수 없어요. 다른 사진으로 시도해 주세요."; }); }); }, Promise.resolve())
        .then(function(){ d.imgBusy = false; if (gForms.tips === d) gRenderForm(); });
      return;
    }
    if (e.target.getAttribute("data-g") === "showboss") { gShowBoss = e.target.checked; gRenderView(true); gRefocus('[data-g="showboss"]'); }
  });
  el.addEventListener("input", function(e){
    var f = e.target.getAttribute("data-gf"), kk = e.target.getAttribute("data-k"), li = e.target.getAttribute("data-gl");
    if (f && gForms[kk]) {
      gForms[kk][f] = e.target.value;
      if (gForms[kk].errs[f]) { gForms[kk].errs[f] = ""; e.target.classList.remove("bad"); var er = document.getElementById(e.target.id + "-err"); if (er) er.textContent = ""; }
    }
    if (li != null && gForms.tips) gForms.tips.links[+li] = e.target.value;
    if (e.target.id === "gf-mkt") {
      var raw = e.target.value.replace(/[^\d]/g, "").slice(0, 10);
      gRaidMkt = raw ? (+raw).toLocaleString("ko-KR") : "";
      e.target.value = gRaidMkt;
      var ro = document.getElementById("gRaidOut"); if (ro) ro.innerHTML = gRaidPrice() + '<small>다이아</small>';
    }
  });
});
window.addEventListener("beforeunload", function(e){
  var busy = (gForms.notice && (gForms.notice.title || gForms.notice.body)) || (gForms.tips && (gForms.tips.title || gForms.tips.body));
  if (busy) { e.preventDefault(); e.returnValue = ""; }
});

/* 첫 화면 (…/boss/#raid → 분배 방식 안내글, …/boss/#notice-ab12cd → 그 공지를 바로 보여줌) */
gNDetail = gNHashDetail();
app.hidden = gView !== "boss";
Object.keys(gViewEl).forEach(function(key){ gViewEl[key].hidden = key !== gView; });
if (gView !== "boss") gRenderView();
gRenderNav();

/* ---------- 자동 업데이트: 새 버전이 올라오면 알아서 새로고침 ---------- */
var lastUpdCheck = 0;
function autoUpdate(force){
  var t = Date.now();
  if (!force && t - lastUpdCheck < 60000) return; // 1분에 한 번까지만 확인
  lastUpdCheck = t;
  fetch(location.pathname + "?vcheck=" + t, { cache: "no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = txt.match(/var BUILD = "([^"]+)"/); if (!m) return;
    latestBuild = m[1]; buildChecked = true;
    var el = document.getElementById("verBox"); if (el) el.innerHTML = verHtml();
    if (m[1] <= BUILD) return;                                  // 지금 보는 게 최신
    if (dirty || dlg.open || editing() || gForms.notice || gForms.tips || gForms.schedule || gIntroEdit !== null) return; // 작성·수정 중이면 다음에 다시
    var tried = null; try { tried = sessionStorage.getItem("boss-upd"); } catch (e) {}
    if (tried === m[1]) return;                                  // 같은 버전으로는 한 번만 시도
    try { sessionStorage.setItem("boss-upd", m[1]); } catch (e) {}
    // 주소에 버전을 붙여 옛 파일을 건너뛰고, #notice 같은 메뉴 주소는 그대로 유지
    location.replace(location.pathname + "?v=" + m[1].replace(/\D/g, "") + location.hash);
  }).catch(function(){});
}

render();
setInterval(tick, 1000);
setTimeout(function(){ autoUpdate(true); }, 3000);
setInterval(function(){ autoUpdate(true); }, 5 * M);
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") autoUpdate(); });
window.addEventListener("pageshow", function(e){ if (e.persisted) autoUpdate(true); });
syncClock(); setInterval(syncClock, 10 * M);
})();
</script>
